# git-cliff — generates CHANGELOG.md from Conventional Commits.
[changelog]
header = """
# Changelog

All notable changes to StaySphere are recorded here.
This file is generated from Conventional Commit messages; do not edit it by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^ci", group = "📦 Platform & infrastructure" },
  { message = "^build", group = "📦 Platform & infrastructure" },
  { message = "^chore\\(deps\\)", group = "⬆️ Dependencies" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { body = ".*security", group = "🔒 Security" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
