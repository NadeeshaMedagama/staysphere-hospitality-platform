# Template only — never apply this file, and never commit real values.
#
# In a real cluster these come from External Secrets Operator, Sealed Secrets or
# the cloud provider's secret manager. Committing a Secret manifest puts
# base64-encoded credentials in git, and base64 is not encryption.
#
#   kubectl create secret generic staysphere-secrets \
#     --namespace staysphere \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgresql://…-pooler.neon.tech/…' \
#     --from-literal=DIRECT_URL='postgresql://….neon.tech/…'
apiVersion: v1
kind: Secret
metadata:
  name: staysphere-secrets
  namespace: staysphere
type: Opaque
stringData:
  JWT_ACCESS_SECRET: replace-me-with-at-least-32-characters
  JWT_REFRESH_SECRET: replace-me-with-at-least-32-characters
  DATABASE_URL: postgresql://user:password@host/db?sslmode=require
  DIRECT_URL: postgresql://user:password@host/db?sslmode=require
