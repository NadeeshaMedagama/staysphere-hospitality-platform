# Reference manifest for a StaySphere microservice.
#
# `SERVICE_NAME` and `IMAGE_TAG` are substituted per service by the deploy
# pipeline. Every service is identical in shape — the same probes, the same
# security context, the same resource envelope — because a service that is
# special in its deployment is a service nobody can reason about at 3am.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: staysphere
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/part-of: staysphere
    app.kubernetes.io/component: service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity below the current replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE_NAME
        app.kubernetes.io/part-of: staysphere
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # SIGTERM → Nest's shutdown hooks → in-flight requests finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: SERVICE_NAME
          image: ghcr.io/OWNER/staysphere-SERVICE_NAME:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_NAME
              value: SERVICE_NAME
            - name: SERVICE_VERSION
              value: IMAGE_TAG
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: staysphere-config
            - secretRef:
                name: staysphere-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit: throttling a Node process under a burst adds
              # latency without protecting anything the request already reserves.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Liveness never touches a dependency — a database blip must not get
          # otherwise-healthy pods killed.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check dependencies, so a degraded pod leaves the
          # load balancer without being restarted.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: staysphere
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/part-of: staysphere
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: SERVICE_NAME
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: SERVICE_NAME
  namespace: staysphere
spec:
  # Keeps at least one pod serving during a node drain or cluster upgrade.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE_NAME
  namespace: staysphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: SERVICE_NAME
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      # Scale down slowly: a five-minute window stops the autoscaler
      # oscillating on a spiky booking workload.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
