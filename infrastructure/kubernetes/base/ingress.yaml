apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staysphere-api
  namespace: staysphere
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # A second rate limit at the edge, ahead of the gateway's own. This one
    # sheds a flood before it reaches Node at all.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
    - hosts: [api.staysphere.example]
      secretName: staysphere-api-tls
  rules:
    - host: api.staysphere.example
      http:
        paths:
          # Everything enters through the gateway. No service is reachable from
          # outside the cluster on its own.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
