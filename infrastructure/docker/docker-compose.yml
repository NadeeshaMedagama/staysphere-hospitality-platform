###############################################################################
# StaySphere — local development stack.
#
# Brings up the infrastructure the platform depends on (Postgres, Redis, Kafka,
# MailHog, Prometheus, Grafana) plus the three implemented services.
#
#   pnpm docker:up      start everything
#   pnpm docker:logs    follow logs
#   pnpm docker:down    stop and remove
#
# Host ports for Postgres, Redis and Kafka are overridable, because a machine
# with a native Postgres on 5432 would otherwise win the bind and every service
# would quietly talk to the wrong database:
#
#   POSTGRES_PORT=55432 pnpm docker:up
#
# Production deploys do NOT use this file: the frontends go to Vercel and the
# services run from the published images.
###############################################################################

name: staysphere

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [staysphere]
  environment: &common-env
    NODE_ENV: development
    LOG_LEVEL: debug
    KAFKA_BROKERS: kafka:9092
    REDIS_URL: redis://redis:6379
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---------------------------------------------------------------- data ----
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: staysphere
      POSTGRES_PASSWORD: staysphere_dev_password
      # One cluster, one database per service — the logical isolation of
      # database-per-service without running five containers locally.
      POSTGRES_MULTIPLE_DATABASES: staysphere_auth,staysphere_booking,staysphere_hotel,staysphere_room,staysphere_pricing,staysphere_payment,staysphere_stay,staysphere_finance,staysphere_housekeeping,staysphere_maintenance,staysphere_notification,staysphere_review,staysphere_reporting,staysphere_audit
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staysphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [staysphere]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [staysphere]
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.9
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      # KRaft mode — no ZooKeeper.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes: [kafka-data:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [staysphere]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: staysphere-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [staysphere]
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]
    networks: [staysphere]
    restart: unless-stopped

  # ------------------------------------------------------------ services ----
  auth-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: auth-service }
    ports: ["3001:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_auth
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_auth
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  booking-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: booking-service }
    ports: ["3002:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: booking-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_booking
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_booking
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  hotel-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: hotel-service }
    ports: ["3003:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: hotel-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_hotel
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_hotel
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  room-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: room-service }
    ports: ["3004:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: room-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_room
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_room
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
