      kafka: { condition: service_healthy }

  payment-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: payment-service }
    ports: ["3006:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_payment
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_payment
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  stay-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: stay-service }
    ports: ["3007:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: stay-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_stay
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_stay
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  finance-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: finance-service }
    ports: ["3008:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: finance-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_finance
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_finance
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  housekeeping-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: housekeeping-service }
    ports: ["3009:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: housekeeping-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_housekeeping
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_housekeeping
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  maintenance-service:
    <<: *service-defaults
