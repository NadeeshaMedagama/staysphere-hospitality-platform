      kafka: { condition: service_healthy }

  notification-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: notification-service }
    ports: ["3011:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_notification
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_notification
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  review-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: review-service }
    ports: ["3012:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: review-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_review
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_review
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  reporting-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: reporting-service }
    ports: ["3013:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: reporting-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_reporting
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_reporting
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  audit-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: audit-service }
    ports: ["3014:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: audit-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_audit
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_audit
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api-gateway:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: api-gateway }
    ports: ["3000:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3000
      HOTEL_SERVICE_URL: http://hotel-service:3000
      ROOM_SERVICE_URL: http://room-service:3000
      PRICING_SERVICE_URL: http://pricing-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      STAY_SERVICE_URL: http://stay-service:3000
      FINANCE_SERVICE_URL: http://finance-service:3000
      HOUSEKEEPING_SERVICE_URL: http://housekeeping-service:3000
      MAINTENANCE_SERVICE_URL: http://maintenance-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      REVIEW_SERVICE_URL: http://review-service:3000
      REPORTING_SERVICE_URL: http://reporting-service:3000
      AUDIT_SERVICE_URL: http://audit-service:3000
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
      CORS_ORIGINS: http://localhost:3100,http://localhost:3200,http://localhost:3300
    depends_on:
      auth-service: { condition: service_started }
      booking-service: { condition: service_started }

  # ---------------------------------------------------------- front ends ----
  web:
    restart: unless-stopped
    networks: [staysphere]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args: { APP: web }
    ports: ["3100:3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    depends_on:
      api-gateway: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  admin:
    restart: unless-stopped
    networks: [staysphere]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args: { APP: admin }
    ports: ["3200:3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    depends_on:
      api-gateway: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  staff:
    restart: unless-stopped
    networks: [staysphere]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args: { APP: staff }
    ports: ["3300:3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    depends_on:
      api-gateway: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ------------------------------------------------------- observability ----
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks: [staysphere]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["${GRAFANA_PORT:-3301}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: staysphere
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus]
    networks: [staysphere]
    restart: unless-stopped

networks:
  staysphere:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
