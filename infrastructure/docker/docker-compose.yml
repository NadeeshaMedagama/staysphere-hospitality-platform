      args: { SERVICE: maintenance-service }
    ports: ["3010:3000"]
    environment:
      <<: *common-env
      SERVICE_NAME: maintenance-service
      DATABASE_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_maintenance
      DIRECT_URL: postgresql://staysphere:staysphere_dev_password@postgres:5432/staysphere_maintenance
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-in-production-32
    depends_on:
