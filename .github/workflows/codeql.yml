name: CodeQL Security Analysis

# Static analysis for injection, insecure crypto, path traversal, prototype
# pollution and untrusted-input flows across the TypeScript sources and the
# workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:17 every Monday. A fixed weekly run catches newly published queries
    # against code that has not changed; the odd minute avoids the top-of-hour
    # scheduling stampede on GitHub's runners.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-severity and experimental queries on top
          # of the default set; quality adds maintainability checks.
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/.next'
              - '**/coverage'
              - '**/generated'
              - '**/*.spec.ts'
              - '**/*.test.ts'

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: always

  summary:
    name: CodeQL summary
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            {
              echo "### ✅ CodeQL analysis completed"
              echo ""
              echo "Findings, if any, are in the repository's **Security → Code scanning** tab."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ CodeQL analysis did not complete" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
