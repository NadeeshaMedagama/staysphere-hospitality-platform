name: Security

# Supply-chain and secret hygiene, alongside CodeQL's static analysis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Only meaningful on a PR: it diffs the manifests against the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would force the whole platform open; block them at
          # the point a dependency is introduced rather than at release.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-3.0, SSPL-1.0

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: pnpm audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          pnpm audit --audit-level=high --json > audit.json
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Summarise advisories
        run: |
          if [[ ! -s audit.json ]]; then
            echo "### ✅ No advisories reported" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          high=$(jq '[.advisories // {} | .[] | select(.severity=="high")] | length' audit.json 2>/dev/null || echo 0)
          critical=$(jq '[.advisories // {} | .[] | select(.severity=="critical")] | length' audit.json 2>/dev/null || echo 0)
          {
            echo "### Dependency audit"
            echo ""
            echo "| Severity | Count |"
            echo "| --- | --- |"
            echo "| Critical | $critical |"
            echo "| High | $high |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$critical" -gt 0 ]]; then
            echo "::error::$critical critical advisory/advisories must be resolved before merge."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the commits a PR introduces, not just
          # the final tree — a secret added then removed is still leaked.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  image-scan:
    name: Image scan · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, booking-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: false
          load: true
          tags: staysphere/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: staysphere/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
